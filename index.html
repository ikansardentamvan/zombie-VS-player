<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEON BLASTER</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- UI -->
  <div id="ui">
    ❤️ HP: <span>100</span><br>
    ⚡ Score: <span>0</span>
  </div>

  <!-- Game Over -->
  <div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Final Score: 0</p>
    <button>MAIN LAGI</button>
  </div>

  <!-- Info -->
  <div id="info">
    WASD / Arrow = Gerak • Tahan Klik = Tembak
  </div>

  <!-- Area Game -->
  <div class="game-area">

    <!-- Player -->
    <div class="player"></div>

    <!-- Enemy -->
    <div class="enemy enemy1"></div>
    <div class="enemy enemy2"></div>

    <!-- Bullet -->
    <div class="bullet"></div>

  </div>

</body>
</html>
